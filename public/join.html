<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Welcome · Clark Family Tree</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/family.css">
</head>
<body>
<main class="wrap">
  <h1>The Clark Family</h1>
  <p class="lede">Every branch carries a story.</p>
  <div id="checking" class="card"><p>One moment…</p></div>
  <form id="codeForm" class="card hidden">
    <label for="code" class="big">Type the family code from your card</label>
    <input id="code" name="code" class="field" autocomplete="off" autocapitalize="characters" inputmode="text" placeholder="e.g. MAMABIG74" required>
    <p id="err" class="error hidden" role="alert"></p>
    <button class="go" type="submit">Continue</button>
  </form>
  <div id="choices" class="card hidden">
    <p class="big">You're in. What would you like to do?</p>
    <a class="go" id="addLink" href="/add">Add yourself to the tree</a>
    <a class="go secondary" href="/">See the family tree</a>
  </div>
</main>
<script>
const $=s=>document.querySelector(s);
const params=new URLSearchParams(location.search);
const next=(params.get('next')||'').startsWith('/')?params.get('next'):null;
function show(id){for(const x of ['#checking','#codeForm','#choices'])$(x).classList.toggle('hidden',x!==id);}
async function join(code){
  const r=await fetch('/api/join',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code}),credentials:'same-origin'});
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'That didn’t work. Try again.');}
function done(){history.replaceState(null,'','/join');if(next){location.href=next;return;}show('#choices');}
$('#codeForm').addEventListener('submit',async e=>{e.preventDefault();$('#err').classList.add('hidden');
  try{await join($('#code').value);done();}catch(err){$('#err').textContent=err.message;$('#err').classList.remove('hidden');}});
(async()=>{
  const me=await fetch('/api/me',{credentials:'same-origin'}).then(r=>r.json()).catch(()=>({}));
  if(me.member){done();return;}
  const code=params.get('code');
  if(code){try{await join(code);done();return;}catch(e){$('#err').textContent=e.message;$('#err').classList.remove('hidden');}}
  show('#codeForm');$('#code').focus();
})();
</script>
</body>
</html>
